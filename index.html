<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>카카오맵 장소 검색</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 100%;
      height: 100vh;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }

    /* 전체 레이아웃 */
    .container {
      display: flex;
      width: 100%;
      height: 100vh;
    }

    /* 왼쪽 패널 */
    .sidebar {
      width: 35%;
      min-width: 320px;
      background-color: #ffffff;
      border-right: 1px solid #ddd;
      display: flex;
      flex-direction: column;
    }

    /* 검색 영역 */
    .search-area {
      padding: 20px;
      border-bottom: 1px solid #eee;
    }

    .search-title {
      font-size: 24px;
      font-weight: bold;
      margin-bottom: 15px;
    }

    .search-box {
      display: flex;
      gap: 10px;
    }

    .search-box input {
      flex: 1;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 14px;
      outline: none;
    }

    .search-box input:focus {
      border-color: #fee500;
    }

    .search-box button {
      padding: 12px 16px;
      border: none;
      border-radius: 8px;
      background-color: #fee500;
      cursor: pointer;
      font-weight: bold;
    }

    .search-box button:hover {
      background-color: #f6dc00;
    }

    /* 검색 결과 리스트 */
    .result-list {
      flex: 1;
      overflow-y: auto;
      padding: 15px;
    }

    .place-item {
      padding: 15px;
      border: 1px solid #eee;
      border-radius: 10px;
      margin-bottom: 12px;
      cursor: pointer;
      transition: 0.2s;
    }

    .place-item:hover {
      background-color: #fafafa;
      border-color: #ccc;
    }

    .place-name {
      font-size: 17px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .place-address {
      font-size: 14px;
      color: #666;
      margin-bottom: 5px;
    }

    .place-phone {
      font-size: 13px;
      color: #888;
    }

    /* 오른쪽 지도 */
    .map-area {
      flex: 1;
      position: relative;
    }

    #map {
      width: 100%;
      height: 100%;
    }

    /* 모바일 대응 */
    @media (max-width: 768px) {
      .container {
        flex-direction: column;
      }

      .sidebar {
        width: 100%;
        height: 45%;
      }

      .map-area {
        height: 55%;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <!-- 왼쪽 검색 패널 -->
    <div class="sidebar">

      <div class="search-area">
        <div class="search-title">장소 검색</div>

        <div class="search-box">
          <input
            type="text"
            id="keyword"
            placeholder="검색어 입력"
          />

          <button onclick="searchPlace()">
            검색
          </button>
        </div>
      </div>

      <!-- 검색 결과 -->
      <div class="result-list" id="resultList"></div>

    </div>

    <!-- 오른쪽 지도 -->
    <div class="map-area">
      <div id="map"></div>
    </div>

  </div>

  <!-- 카카오맵 SDK -->
  <!-- https 프로토콜 명시 -->
  <!-- autoload=false 사용 -->
  <script
    src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=160564250f15a7efdc3de15f9122a589&libraries=services&autoload=false">
  </script>

  <script>

    let map;
    let places;
    let markers = [];
    let infoWindow;

    // 지도 초기화 함수
    function initializeMap(latitude, longitude) {

      const mapContainer = document.getElementById("map");

      const mapOption = {
        center: new kakao.maps.LatLng(latitude, longitude),
        level: 5
      };

      // 지도 생성
      map = new kakao.maps.Map(mapContainer, mapOption);

      // 장소 검색 객체 생성
      places = new kakao.maps.services.Places();

      // 인포윈도우 생성
      infoWindow = new kakao.maps.InfoWindow({
        zIndex: 1
      });

      // 현재 위치 좌표
      const currentPosition = new kakao.maps.LatLng(
        latitude,
        longitude
      );

      // 현재 위치 마커 생성
      const currentMarker = new kakao.maps.Marker({
        map: map,
        position: currentPosition
      });

      // 현재 위치 인포윈도우
      const currentInfo = new kakao.maps.InfoWindow({
        content: "<div style='padding:5px;'>현재 위치</div>"
      });

      currentInfo.open(map, currentMarker);
    }

    // 현재 위치 가져오기
    function getCurrentLocation() {

      // 위치 정보 지원 여부 확인
      if (navigator.geolocation) {

        navigator.geolocation.getCurrentPosition(

          // 성공 시
          function(position) {

            const latitude = position.coords.latitude;
            const longitude = position.coords.longitude;

            initializeMap(latitude, longitude);
          },

          // 실패 시 기본 위치 사용
          function(error) {

            alert("현재 위치를 가져올 수 없습니다.");

            // 서울 시청 기본 좌표
            initializeMap(37.5665, 126.9780);
          }

        );

      } else {

        alert("브라우저가 위치 정보를 지원하지 않습니다.");

        // 서울 시청 기본 좌표
        initializeMap(37.5665, 126.9780);
      }
    }

    // 검색 실행 함수
    function searchPlace() {

      const keyword = document
        .getElementById("keyword")
        .value
        .trim();

      // 검색어 입력 여부 확인
      if (!keyword) {

        alert("검색어를 입력해주세요.");
        return;
      }

      // 키워드 검색 실행
      places.keywordSearch(
        keyword,
        placesSearchCallback
      );
    }

    // 검색 결과 콜백 함수
    function placesSearchCallback(data, status) {

      // 검색 성공
      if (status === kakao.maps.services.Status.OK) {

        displayPlaces(data);
      }

      // 검색 결과 없음
      else if (
        status === kakao.maps.services.Status.ZERO_RESULT
      ) {

        alert("검색 결과가 없습니다.");
      }

      // API 에러
      else if (
        status === kakao.maps.services.Status.ERROR
      ) {

        alert("검색 중 오류가 발생했습니다.");
      }
    }

    // 검색 결과 출력
    function displayPlaces(placeData) {

      const resultList = document.getElementById("resultList");

      // 기존 결과 삭제
      resultList.innerHTML = "";

      // 기존 마커 삭제
      removeMarkers();

      // 지도 범위 객체 생성
      const bounds = new kakao.maps.LatLngBounds();

      placeData.forEach(function(place) {

        const position = new kakao.maps.LatLng(
          place.y,
          place.x
        );

        // 마커 생성
        const marker = new kakao.maps.Marker({
          map: map,
          position: position
        });

        markers.push(marker);

        // 지도 범위에 좌표 추가
        bounds.extend(position);

        // 검색 결과 HTML 생성
        const item = document.createElement("div");

        item.className = "place-item";

        item.innerHTML = `
          <div class="place-name">
            ${place.place_name}
          </div>

          <div class="place-address">
            ${place.address_name}
          </div>

          <div class="place-phone">
            ${place.phone || "전화번호 없음"}
          </div>
        `;

        // 리스트 클릭 시 지도 이동
        item.addEventListener("click", function() {

          map.setCenter(position);

          infoWindow.setContent(`
            <div style="padding:8px; font-size:13px;">
              ${place.place_name}
            </div>
          `);

          infoWindow.open(map, marker);
        });

        // 마커 클릭 이벤트
        kakao.maps.event.addListener(
          marker,
          "click",
          function() {

            infoWindow.setContent(`
              <div style="padding:8px; font-size:13px;">
                ${place.place_name}
              </div>
            `);

            infoWindow.open(map, marker);
          }
        );

        resultList.appendChild(item);
      });

      // 검색 결과가 모두 보이도록 지도 범위 자동 조절
      map.setBounds(bounds);
    }

    // 기존 마커 제거 함수
    function removeMarkers() {

      markers.forEach(function(marker) {

        marker.setMap(null);

      });

      markers = [];
    }

    // Enter 키 검색 지원
    document.addEventListener("keydown", function(event) {

      if (event.key === "Enter") {

        searchPlace();
      }
    });

    // 지도 로드 완료 후 실행
    window.onload = function() {

      // kakao.maps.load() 사용
      kakao.maps.load(function() {

        getCurrentLocation();

      });

    };

  </script>

</body>
</html>
