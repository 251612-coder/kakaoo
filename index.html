<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>24시간 운영 매장 지도</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 100%;
      height: 100vh;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }

    /* 전체 레이아웃 */
    .container {
      display: flex;
      width: 100%;
      height: 100vh;
    }

    /* 왼쪽 패널 */
    .sidebar {
      width: 35%;
      min-width: 340px;
      background-color: #ffffff;
      border-right: 1px solid #ddd;
      display: flex;
      flex-direction: column;
    }

    /* 검색 영역 */
    .search-area {
      padding: 20px;
      border-bottom: 1px solid #eee;
    }

    .search-title {
      font-size: 24px;
      font-weight: bold;
      margin-bottom: 15px;
    }

    .search-box {
      display: flex;
      gap: 10px;
    }

    .search-box input {
      flex: 1;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 14px;
      outline: none;
    }

    .search-box input:focus {
      border-color: #fee500;
    }

    .search-box button {
      padding: 12px 16px;
      border: none;
      border-radius: 8px;
      background-color: #fee500;
      cursor: pointer;
      font-weight: bold;
    }

    .search-box button:hover {
      background-color: #f6dc00;
    }

    /* 검색 결과 리스트 */
    .result-list {
      flex: 1;
      overflow-y: auto;
      padding: 15px;
    }

    .place-item {
      padding: 15px;
      border: 1px solid #eee;
      border-radius: 10px;
      margin-bottom: 12px;
      cursor: pointer;
      transition: 0.2s;
    }

    .place-item:hover {
      background-color: #fafafa;
      border-color: #ccc;
    }

    .place-name {
      font-size: 17px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .place-address {
      font-size: 14px;
      color: #666;
      margin-bottom: 5px;
    }

    .place-phone {
      font-size: 13px;
      color: #888;
    }

    .place-category {
      display: inline-block;
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: bold;
      margin-top: 5px;
    }

    .cafe-category {
      background-color: #dbeafe;
      color: #2563eb;
    }

    .restaurant-category {
      background-color: #fef3c7;
      color: #ca8a04;
    }

    /* 페이지네이션 */
    .pagination {
      display: flex;
      justify-content: center;
      gap: 8px;
      padding: 15px;
      border-top: 1px solid #eee;
    }

    .page-button {
      padding: 8px 12px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      background-color: #f3f4f6;
    }

    .page-button.active {
      background-color: #fee500;
      font-weight: bold;
    }

    /* 지도 영역 */
    .map-area {
      flex: 1;
      position: relative;
    }

    #map {
      width: 100%;
      height: 100%;
    }

    /* 모바일 대응 */
    @media (max-width: 768px) {
      .container {
        flex-direction: column;
      }

      .sidebar {
        width: 100%;
        height: 45%;
      }

      .map-area {
        height: 55%;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <!-- 왼쪽 검색 패널 -->
    <div class="sidebar">

      <div class="search-area">

        <div class="search-title">
          24시간 운영 매장 검색
        </div>

        <div class="search-box">

          <input
            type="text"
            id="keyword"
            placeholder="예: 24시 카페"
          />

          <button onclick="searchPlace()">
            검색
          </button>

        </div>

      </div>

      <!-- 검색 결과 -->
      <div class="result-list" id="resultList"></div>

      <!-- 페이지 버튼 -->
      <div class="pagination" id="pagination"></div>

    </div>

    <!-- 지도 영역 -->
    <div class="map-area">
      <div id="map"></div>
    </div>

  </div>

  <!-- 카카오맵 SDK -->
  <script
    src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=160564250f15a7efdc3de15f9122a589&libraries=services&autoload=false">
  </script>

  <script>

    let map;
    let places;
    let markers = [];
    let infoWindow;

    // 지도 초기화 함수
    function initializeMap(latitude, longitude) {

      const mapContainer = document.getElementById("map");

      const mapOption = {
        center: new kakao.maps.LatLng(latitude, longitude),
        level: 5
      };

      // 지도 생성
      map = new kakao.maps.Map(mapContainer, mapOption);

      // 장소 검색 객체 생성
      places = new kakao.maps.services.Places();

      // 인포윈도우 생성
      infoWindow = new kakao.maps.InfoWindow({
        zIndex: 1
      });

      // 현재 위치 좌표
      const currentPosition = new kakao.maps.LatLng(
        latitude,
        longitude
      );

      // 빨간 점 마커 생성
      const redMarkerElement = document.createElement("div");

      redMarkerElement.style.width = "16px";
      redMarkerElement.style.height = "16px";
      redMarkerElement.style.backgroundColor = "red";
      redMarkerElement.style.borderRadius = "50%";
      redMarkerElement.style.border = "3px solid white";
      redMarkerElement.style.boxShadow = "0 0 6px rgba(0,0,0,0.3)";

      // 현재 위치 커스텀 오버레이
      const currentOverlay = new kakao.maps.CustomOverlay({
        position: currentPosition,
        content: redMarkerElement,
        yAnchor: 0.5
      });

      currentOverlay.setMap(map);
    }

    // 현재 위치 가져오기
    function getCurrentLocation() {

      if (navigator.geolocation) {

        navigator.geolocation.getCurrentPosition(

          function(position) {

            const latitude = position.coords.latitude;
            const longitude = position.coords.longitude;

            initializeMap(latitude, longitude);
          },

          function(error) {

            alert("현재 위치를 가져올 수 없습니다.");

            initializeMap(37.5665, 126.9780);
          }

        );

      } else {

        alert("브라우저가 위치 정보를 지원하지 않습니다.");

        initializeMap(37.5665, 126.9780);
      }
    }

    // 검색 실행 함수
    function searchPlace() {

      const keyword = document
        .getElementById("keyword")
        .value
        .trim();

      if (!keyword) {

        alert("검색어를 입력해주세요.");
        return;
      }

      places.keywordSearch(
        keyword,
        placesSearchCallback,
        {
          page: 1,
          size: 10
        }
      );
    }

    // 검색 결과 콜백 함수
    function placesSearchCallback(data, status, pagination) {

      if (status === kakao.maps.services.Status.OK) {

        displayPlaces(data);
        displayPagination(pagination);
      }

      else if (
        status === kakao.maps.services.Status.ZERO_RESULT
      ) {

        alert("검색 결과가 없습니다.");
      }

      else if (
        status === kakao.maps.services.Status.ERROR
      ) {

        alert("검색 중 오류가 발생했습니다.");
      }
    }

    // 검색 결과 출력 함수
    function displayPlaces(placeData) {

      const resultList = document.getElementById("resultList");

      // 기존 결과 삭제
      resultList.innerHTML = "";

      // 기존 마커 제거
      removeMarkers();

      // 지도 범위 객체 생성
      const bounds = new kakao.maps.LatLngBounds();

      placeData.forEach(function(place) {

        const position = new kakao.maps.LatLng(
          place.y,
          place.x
        );

        // 카테고리 확인
        const isCafe =
          place.category_group_code === "CE7";

        const isRestaurant =
          place.category_group_code === "FD6";

        // 마커 색상 설정
        let markerColor = "#9ca3af";

        if (isCafe) {
          markerColor = "#2563eb";
        }

        if (isRestaurant) {
          markerColor = "#facc15";
        }

        // 커스텀 마커 생성
        const markerElement = document.createElement("div");

        markerElement.style.width = "20px";
        markerElement.style.height = "20px";
        markerElement.style.borderRadius = "50%";
        markerElement.style.backgroundColor = markerColor;
        markerElement.style.border = "3px solid white";
        markerElement.style.boxShadow =
          "0 0 6px rgba(0,0,0,0.3)";

        const marker = new kakao.maps.CustomOverlay({
          position: position,
          content: markerElement,
          yAnchor: 0.5
        });

        marker.setMap(map);

        markers.push(marker);

        // 지도 범위 추가
        bounds.extend(position);

        // 카테고리 텍스트
        let categoryText = "기타";
        let categoryClass = "";

        if (isCafe) {
          categoryText = "카페";
          categoryClass = "cafe-category";
        }

        if (isRestaurant) {
          categoryText = "식당";
          categoryClass = "restaurant-category";
        }

        // 결과 아이템 생성
        const item = document.createElement("div");

        item.className = "place-item";

        item.innerHTML = `
          <div class="place-name">
            ${place.place_name}
          </div>

          <div class="place-address">
            ${place.address_name}
          </div>

          <div class="place-phone">
            ${place.phone || "전화번호 없음"}
          </div>

          <div class="place-category ${categoryClass}">
            ${categoryText}
          </div>
        `;

        // 리스트 클릭 이벤트
        item.addEventListener("click", function() {

          map.setCenter(position);

          infoWindow.setContent(`
            <div style="padding:8px; font-size:13px;">
              ${place.place_name}
            </div>
          `);

          infoWindow.open(map);
          infoWindow.setPosition(position);
        });

        // 마커 클릭 이벤트
        markerElement.addEventListener("click", function() {

          infoWindow.setContent(`
            <div style="padding:8px; font-size:13px;">
              ${place.place_name}
            </div>
          `);

          infoWindow.open(map);
          infoWindow.setPosition(position);
        });

        resultList.appendChild(item);
      });

      // 지도 범위 자동 조절
      map.setBounds(bounds);
    }

    // 페이지네이션 출력 함수
    function displayPagination(pagination) {

      const paginationContainer =
        document.getElementById("pagination");

      paginationContainer.innerHTML = "";

      for (
        let page = 1;
        page <= pagination.last;
        page++
      ) {

        const button = document.createElement("button");

        button.innerText = page;
        button.className = "page-button";

        // 현재 페이지 표시
        if (page === pagination.current) {
          button.classList.add("active");
        }

        // 페이지 클릭 이벤트
        button.addEventListener("click", function() {

          pagination.gotoPage(page);
        });

        paginationContainer.appendChild(button);
      }
    }

    // 기존 마커 제거 함수
    function removeMarkers() {

      markers.forEach(function(marker) {

        marker.setMap(null);

      });

      markers = [];
    }

    // Enter 키 검색 지원
    document.addEventListener("keydown", function(event) {

      if (event.key === "Enter") {

        searchPlace();
      }
    });

    // 지도 로드 완료 후 실행
    window.onload = function() {

      kakao.maps.load(function() {

        getCurrentLocation();

      });

    };

  </script>

</body>
</html>
